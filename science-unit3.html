function particlesABSVG(){
  // A = heated/expanded (far apart, vibrating), B = cooled/contracted
  let a="", b="";
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const x=30+c*34,y=30+r*34;
    a+=`<circle cx="${x}" cy="${y}" r="10" fill="#9bb7e8" stroke="#345"/>
        <path d="M${x-16},${y-6} q-4,6 0,12 M${x+16},${y-6} q4,6 0,12" stroke="#345" fill="none"/>`;
    const x2=230+c*23,y2=45+r*23;
    b+=`<circle cx="${x2}" cy="${y2}" r="10" fill="#9bb7e8" stroke="#345"/>`;
  }
  return `<svg viewBox="0 0 340 180" width="340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui">
    ${a}${b}<text x="80" y="172" font-size="16" font-weight="800" text-anchor="middle">A</text>
    <text x="264" y="172" font-size="16" font-weight="800" text-anchor="middle">B</text></svg>`;
}

    <rect x="15" y="10" width="110" height="110" fill="none" stroke="#999"/>${l}

}

/* =====================================================================
   LƯU TIẾN ĐỘ (localStorage)
   ===================================================================== */
const STORE_KEY="sci4_unit3_v1";
let S = {best:{}, tests:[], showVI:true};
try{ const raw=localStorage.getItem(STORE_KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){} }
function record(q,score){
  const max=qMax(q); const prev=S.best[q.id];
  S.best[q.id]={last:score,max,best:Math.max(score,prev?prev.best:0),wrong:score<max};
  save();
}

/* =====================================================================
   TIỆN ÍCH
   ===================================================================== */
const $=s=>document.querySelector(s);
function el(tag,attrs={},html=""){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}if(html)e.innerHTML=html;return e;}
const norm=s=>(" "+String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9'°\s]/g," ").replace(/\s+/g," ").trim()+" ");
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,""));u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function qMax(q){
  if(q.marks!=null) return q.marks;
  if(q.type==="mcq") return 1;
  if(q.type==="tf") return q.items.length;
  if(q.type==="fill") return q.answers.length;
  if(q.type==="match") return q.rows.length*(q.each||1);
  if(q.type==="barchart") return q.data.filter(d=>!d.given).length;
  return 1;
}
const fmt=n=>Math.round(n*10)/10;

/* =====================================================================
   RENDER CÂU HỎI — trả về {check(): score}
   ===================================================================== */
function renderQuestion(q, idx, onScored, mode){
  const box=el("div",{class:"q"});
  const u=UNITS[q.unit];
  box.appendChild(el("div",{class:"qhead"},`<div><span class="unitpill ${u.cls}">Unit ${q.unit}</span><b>Câu ${idx}</b> <button class="speak" title="Đọc to">🔊</button></div><span class="marks">[${qMax(q)}]</span>`));
  box.querySelector(".speak").onclick=()=>speak(q.q+" "+(q.text||"").replace(/\{\d\}/g," blank ")+(q.options?(" "+q.options.join(", ")):""));
  box.appendChild(el("div",{class:"qtext"},q.q));
  if(q.img) box.appendChild(el("div",{class:"svgwrap"},q.img()));
  if(q.html) box.appendChild(el("div",{},q.html));
  const body=el("div"); box.appendChild(body);
  const fb=el("div"); box.appendChild(fb);
  let api;
  const T={mcq:rMCQ,tf:rTF,fill:rFill,match:rMatch,short:rShort,barchart:rBar}[q.type];
  api=T(q,body);
  let done=false;
  const btnRow=el("div",{class:"row",style:"margin-top:10px"});
  const chk=el("button",{class:"btn"},"Kiểm tra ✓");
  if(mode==="practice"){btnRow.appendChild(chk);box.appendChild(btnRow);}
  function check(){
    if(done) return api.score;
    done=true; chk.disabled=true;
    const sc=api.grade();
    showFB(sc);
    record(q,sc);
    onScored && onScored(sc,q);
    return sc;
  }
  function showFB(sc){
    const max=qMax(q);
    const cls=sc>=max?"good":sc>0?"part":"bad";
    const head=sc>=max?"🎉 Chính xác! Full marks":sc>0?"👍 Gần đúng rồi":"❌ Chưa đúng";
    let h=`<b>${head} — ${fmt(sc)}/${max} điểm</b>`;
    if(q.model) h+=`<div class="model">✍️ <b>Full-mark answer:</b> ${q.model} <button class="speak">🔊</button></div>`;
    if(q.ex) h+=`<div style="margin-top:6px">💡 ${q.ex}</div>`;
    if(q.vi) h+=`<div class="vi">🇻🇳 ${q.vi}</div>`;
    fb.className="fb "+cls; fb.innerHTML=h;
    const sp=fb.querySelector(".model .speak"); if(sp) sp.onclick=()=>speak(q.model);
    if(api.after) api.after(fb,(newSc)=>{ const old=api.score; api.score=newSc; record(q,newSc); onScored&&onScored(newSc-old,q,true); showFB(newSc);});
  }
  chk.onclick=check;
  return {node:box,check,get score(){return api.score||0}};
}

function rMCQ(q,body){
  let sel=null; const btns=[];
  const order=q.options.map((o,i)=>i);
  order.forEach(i=>{const b=el("button",{class:"opt"},`${String.fromCharCode(65+btns.length)}. ${q.options[i]}`);b.onclick=()=>{if(api.locked)return;sel=i;btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");};b.dataset.i=i;btns.push(b);body.appendChild(b);});
  const api={grade(){api.locked=true;btns.forEach(b=>{const i=+b.dataset.i;if(i===q.a)b.classList.add("right");else if(i===sel)b.classList.add("wrong");});api.score=sel===q.a?1:0;return api.score;}};
  return api;
}
function rTF(q,body){
  const ans=q.items.map(()=>null); const rows=[];
  q.items.forEach((it,i)=>{
    const r=el("div",{class:"tfrow"},`<div class="s">${it.s}</div>`);
    const t=el("button",{class:"tfb"},"True"),f=el("button",{class:"tfb"},"False");
    t.onclick=()=>{if(api.locked)return;ans[i]=true;t.classList.add("sel");f.classList.remove("sel");};
    f.onclick=()=>{if(api.locked)return;ans[i]=false;f.classList.add("sel");t.classList.remove("sel");};
    r.append(t,f);body.appendChild(r);rows.push({r,t,f});
  });
  const api={grade(){api.locked=true;let s=0;q.items.forEach((it,i)=>{const {r,t,f}=rows[i];const ok=ans[i]===it.a;if(ok)s++;(it.a?t:f).classList.add("right");if(ans[i]!==null&&!ok)(ans[i]?t:f).classList.add("wrong");if(!ok&&it.ex)r.querySelector(".s").innerHTML+=`<div class="muted" style="font-size:14px">➜ ${it.ex}</div>`;});api.score=s*(qMax(q)/q.items.length);return api.score;}};
  return api;
}
function rFill(q,body){
  let focus=null;
  if(q.bank){const bk=el("div",{class:"bank"});shuffle(q.bank).forEach(w=>{const c=el("button",{class:"chip"},w);c.onclick=()=>{if(api.locked)return;const target=focus&&!focus.value?focus:inputs.find(x=>!x.value)||focus;if(target){target.value=w;target.dispatchEvent(new Event("input"));const nx=inputs.find(x=>!x.value);if(nx){focus=nx;}}};bk.appendChild(c);});body.appendChild(bk);}
  const txt=el("div",{style:"line-height:2.3"},q.text.replace(/\{(\d)\}/g,(m,i)=>`<input class="blank" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false">`));
  body.appendChild(txt);
  const inputs=[...txt.querySelectorAll(".blank")].sort((a,b)=>a.dataset.i-b.dataset.i);
  inputs.forEach(x=>{x.onfocus=()=>focus=x;x.oninput=()=>{x.style.width=Math.max(120,x.value.length*10+30)+"px";};});
  const api={grade(){api.locked=true;let s=0;inputs.forEach(x=>{const i=+x.dataset.i;x.disabled=true;const ok=q.answers[i].some(a=>norm(a)===norm(x.value));if(ok){s++;x.classList.add("right");}else{x.classList.add("wrong");x.insertAdjacentHTML("afterend",` <span style="color:var(--ok);font-weight:700">(${q.answers[i][0]})</span>`);}});api.score=s*(qMax(q)/q.answers.length);return api.score;}};
  return api;
}
function rMatch(q,body){
  const sels=q.rows.map(r=>{const row=el("div",{class:"matchrow"},`<div class="l">${r.l}</div>`);const s=el("select");s.innerHTML=`<option value="">— chọn —</option>`+q.choices.map(c=>`<option>${c}</option>`).join("");row.appendChild(s);body.appendChild(row);return s;});
  const api={grade(){api.locked=true;let s=0;sels.forEach((x,i)=>{x.disabled=true;if(x.value===q.rows[i].a){s++;x.classList.add("right");}else{x.classList.add("wrong");x.insertAdjacentHTML("afterend",` <b style="color:var(--ok)">→ ${q.rows[i].a}</b>`);}});api.score=s*(q.each||1);return api.score;}};
  return api;
}
function rShort(q,body){
  const ta=el("textarea",{placeholder:"Write your answer in English… (Viết câu trả lời bằng tiếng Anh, đủ ý)"});
  body.appendChild(ta);
  body.appendChild(el("div",{class:"muted",style:"font-size:14px"},`💬 Câu này ${qMax(q)} điểm → cần khoảng ${q.all?"1 câu đầy đủ":qMax(q)+" ý"}.`));
  let ticks=[];
  function calc(){const n=ticks.filter(Boolean).length;if(q.all)return n===q.points.length?qMax(q):0;return Math.min(qMax(q),n);}
  const api={grade(){api.locked=true;ta.disabled=true;const t=norm(ta.value);const has=k=>t.includes(norm(k).trim());ticks=q.points.map(p=>p.k.some(k=>Array.isArray(k)?k.every(has):has(k)));api.score=calc();return api.score;},
    after(fb,update){
      const c=el("div",{class:"check",style:"margin-top:8px"},`<div style="font-weight:700">Ý cần có (máy tự chấm theo từ khoá – bố mẹ/con có thể tick lại cho đúng):</div>`);
      q.points.forEach((p,i)=>{const lb=el("label");const cb=el("input",{type:"checkbox"});cb.checked=ticks[i];cb.onchange=()=>{ticks[i]=cb.checked;update(calc());};lb.append(cb,document.createTextNode(" "+p.t));c.appendChild(lb);});
      fb.appendChild(c);
    }};
  return api;
}
function rBar(q,body){
  const vals=q.data.map(d=>d.given?d.v:0);
  const W=420,H=260,x0=50,y0=220,top=20,maxV=120,bw=52,gap=18;
  const wrap=el("div",{class:"svgwrap"});body.appendChild(wrap);
  const ctr=el("div",{class:"row",style:"justify-content:center"});body.appendChild(ctr);
  const yOf=v=>y0-(v/maxV)*(y0-top);
  function draw(){
    let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui" font-size="11">`;
    for(let v=0;v<=maxV;v+=10){g+=`<line x1="${x0}" x2="${W-10}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="${v%20?'#eee':'#ccc'}"/>`;if(v%20===0)g+=`<text x="${x0-6}" y="${yOf(v)+4}" text-anchor="end">${v}</text>`;}
    g+=`<text x="12" y="120" transform="rotate(-90 12 120)" text-anchor="middle" font-weight="700">boiling point in °C</text>`;
    q.data.forEach((d,i)=>{const x=x0+gap/2+i*(bw+gap);const v=vals[i];
      if(v>0)g+=`<rect x="${x}" y="${yOf(v)}" width="${bw}" height="${y0-yOf(v)}" fill="${d.given?'#d9d9d9':'#7fb0ff'}" stroke="#333"/>`;
      g+=`<rect data-i="${i}" class="hit" x="${x}" y="${top}" width="${bw}" height="${y0-top}" fill="transparent" style="cursor:${d.given?'default':'pointer'}"/>`;
      g+=`<text x="${x+bw/2}" y="${y0+14}" text-anchor="middle" font-weight="700">${d.n}</text>`;
      if(!d.given)g+=`<text x="${x+bw/2}" y="${yOf(v)-4}" text-anchor="middle" fill="#2f6fec" font-weight="700">${v}</text>`;});
    g+=`<line x1="${x0}" y1="${y0}" x2="${W-10}" y2="${y0}" stroke="#222" stroke-width="2"/><line x1="${x0}" y1="${top}" x2="${x0}" y2="${y0}" stroke="#222" stroke-width="2"/></svg>`;
    wrap.innerHTML=g;
    const svg=wrap.querySelector("svg");
    wrap.querySelectorAll(".hit").forEach(h=>h.onclick=(ev)=>{const i=+h.dataset.i;if(q.data[i].given||api.locked)return;const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());let v=Math.round(((y0-p.y)/(y0-top))*maxV/10)*10;vals[i]=Math.max(0,Math.min(maxV,v));draw();});
  }
  q.data.forEach((d,i)=>{if(d.given)return;const c=el("div",{class:"row",style:"gap:4px;margin:4px 8px"},`<span style="font-weight:600">${d.n}:</span>`);
    const m=el("button",{class:"btn sec"},"−"),p=el("button",{class:"btn sec"},"+");m.onclick=()=>{if(!api.locked){vals[i]=Math.max(0,vals[i]-10);draw();}};p.onclick=()=>{if(!api.locked){vals[i]=Math.min(maxV,vals[i]+10);draw();}};c.append(m,p);ctr.appendChild(c);});
  draw();
  const api={grade(){api.locked=true;let s=0;const wrong=[];q.data.forEach((d,i)=>{if(d.given)return;if(vals[i]===d.v)s++;else wrong.push(`${d.n} = ${d.v} °C`);});if(wrong.length)body.appendChild(el("div",{style:"color:var(--bad);font-weight:600"},"Đúng phải là: "+wrong.join(", ")));api.score=s;return s;}};
  return api;
}

/* ---------- Mô phỏng hạt ---------- */
function sim(a){
  a.appendChild(el("h2",{},"🧪 Mô phỏng: đun nóng và làm lạnh nước"));
  a.appendChild(el("div",{class:"vi"},"Kéo thanh trượt sang phải để ĐUN NÓNG (thêm nhiệt), sang trái để LÀM LẠNH. Quan sát các hạt và chấm đỏ trên đồ thị."));
  const c=el("div",{class:"card"});
  c.innerHTML=`<div class="grid" style="align-items:center">
    <div style="text-align:center"><canvas id="cv" width="320" height="230"></canvas></div>
    <div><div class="svgwrap">${heatingCurveSVG({marker:true})}</div></div></div>
    <input type="range" id="en" min="0" max="100" value="5" step="0.5">
    <div class="row" style="justify-content:space-between"><span>❄️ Làm lạnh</span><span>🔥 Đun nóng</span></div>
    <div id="info" style="margin-top:10px"></div>`;
  a.appendChild(c);
  const cv=c.querySelector("#cv"),ctx=cv.getContext("2d"),W=320,H=230,R=9,N=36,cols=9;
  const lat=[];for(let i=0;i<N;i++){const r=Math.floor(i/cols),k=i%cols;lat.push({x:W/2-(cols-1)*10+k*20,y:H-R-2-(3-r)*20});}
  const P=lat.map(l=>({x:l.x,y:l.y,vx:0,vy:0,s:0}));
  const range=c.querySelector("#en"),info=c.querySelector("#info"),marker=c.querySelector("#hcMarker");
  let last=+range.value,dir=1;
  function stateAt(e){
    if(e<15)return{T:-30+e/15*30,seg:0,nL:0,nG:0};
    if(e<40)return{T:0,seg:1,nL:Math.round((e-15)/25*N),nG:0};
    if(e<60)return{T:(e-40)/20*100,seg:2,nL:N,nG:0};
    if(e<85)return{T:100,seg:3,nL:N,nG:Math.round((e-60)/25*N)};
    return{T:100+(e-85)/15*30,seg:4,nL:N,nG:N};
  }
  function upd(){
    const e=+range.value; if(e!==last){dir=e>last?1:-1;last=e;}
    const st=stateAt(e);
    P.forEach((p,i)=>{p.s=i<st.nG?2:i<st.nL?1:0;});
    const x=50+e*3.5,y=st.T<=0?170-st.T*1.0:st.T<=100?170-st.T*0.9:80-(st.T-100)*0.9;
    marker.setAttribute("cx",x);marker.setAttribute("cy",y);
    const heat=dir>0;
    const txt=[
      [`<b>A – SOLID (ice)</b>. Temperature ≈ ${Math.round(st.T)} °C. Particles are close together in rows and only <b>vibrate</b>.`, "Chất rắn: hạt sát nhau, xếp hàng, chỉ rung tại chỗ."],
      [heat?`<b>B – MELTING at 0 °C</b>. Particles gain heat energy, vibrate more and break away from their fixed positions. The temperature stays at 0 °C.`:`<b>B – FREEZING at 0 °C</b>. Particles lose heat energy, move more slowly and get stuck in fixed positions.`, heat?"Nóng chảy: nhiệt độ giữ 0 °C, năng lượng dùng để phá vỡ hàng.":"Đông đặc: hạt mất năng lượng, xếp lại thành hàng."],
      [`<b>C – LIQUID water</b>. Temperature ≈ ${Math.round(st.T)} °C. Particles are close together but <b>move around</b> and slide past each other. Some particles at the surface can escape – this is <b>evaporation</b>.`, "Chất lỏng: hạt gần nhau nhưng di chuyển, trượt qua nhau. Ở bề mặt vẫn có bay hơi."],
      [heat?`<b>D – BOILING at 100 °C</b>. Particles gain more energy, move very fast and escape far apart as a gas. Bubbles form throughout the liquid. The temperature stays at 100 °C.`:`<b>D – CONDENSING at 100 °C</b>. Gas particles lose energy, slow down and move closer together to form a liquid.`, heat?"Sôi: nhiệt độ giữ 100 °C, hạt thoát ra thành khí.":"Ngưng tụ: hạt khí mất năng lượng, lại gần nhau thành lỏng."],
      [`<b>E – GAS (water vapour / steam)</b>. Temperature ≈ ${Math.round(st.T)} °C. Particles are <b>far apart</b> and move <b>fast in all directions</b>.`, "Chất khí: hạt ở xa nhau, chuyển động nhanh mọi hướng."]][st.seg];
    info.innerHTML=txt[0]+`<div class="vi">🇻🇳 ${txt[1]}</div>`;
    return st;
  }
  range.oninput=upd;
  let st=upd(),raf;
  function step(){
    st=stateAt(+range.value);
    const amp=0.6+Math.max(0,st.T+30)/40;
    for(const [i,p] of P.entries()){
      if(p.s===0){const l=lat[i];p.x+=(l.x-p.x)*0.2;p.y+=(l.y-p.y)*0.2;p.dx=(Math.random()-.5)*amp;p.dy=(Math.random()-.5)*amp;p.vx=0;p.vy=0;}
      else if(p.s===1){p.vx+=(Math.random()-.5)*(0.6+st.T/60);p.vy+=0.35;p.vx*=0.9;p.vy*=0.9;p.x+=p.vx;p.y+=p.vy;p.dx=p.dy=0;}
      else{const sp=Math.hypot(p.vx,p.vy),want=3+Math.max(0,st.T-100)/10;if(sp<0.1){const a=Math.random()*6.28;p.vx=Math.cos(a)*want;p.vy=Math.sin(a)*want-2;}else{p.vx*=want/sp;p.vy*=want/sp;}p.x+=p.vx;p.y+=p.vy;p.dx=p.dy=0;}
      if(p.x<R){p.x=R;p.vx=Math.abs(p.vx);}if(p.x>W-R){p.x=W-R;p.vx=-Math.abs(p.vx);}
      if(p.y<R){p.y=R;p.vy=Math.abs(p.vy);}if(p.y>H-R){p.y=H-R;p.vy=-Math.abs(p.vy)*(p.s===2?1:0.2);}
    }
    for(let k=0;k<2;k++)for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=P[i],b=P[j];if(a.s===2||b.s===2)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,m=2*R+1;if(d<m){const o=(m-d)/2,ux=dx/d,uy=dy/d;if(a.s===1){a.x-=ux*o*(b.s===0?2:1);a.y-=uy*o*(b.s===0?2:1);}if(b.s===1){b.x+=ux*o*(a.s===0?2:1);b.y+=uy*o*(a.s===0?2:1);}}}
    ctx.clearRect(0,0,W,H);
    for(const p of P){ctx.beginPath();ctx.arc(p.x+(p.dx||0),p.y+(p.dy||0),R,0,6.283);ctx.fillStyle="#5b9bff";ctx.fill();ctx.strokeStyle="#1d3f7a";ctx.lineWidth=1.5;ctx.stroke();}
    ctx.fillStyle="#1d3f7a";ctx.font="bold 14px system-ui";ctx.fillText(Math.round(st.T)+" °C",8,18);
    raf=requestAnimationFrame(step);
  }
  step();
  simStop=()=>cancelAnimationFrame(raf);
  a.appendChild(el("div",{class:"key"},"<b>Ghi nhớ:</b> Đun nóng → hạt <b>gain heat energy</b>, <b>move faster</b>, <b>move further apart</b>. Làm lạnh → <b>lose heat energy</b>, <b>move more slowly</b>, <b>move closer together</b>. Bản thân hạt KHÔNG to ra hay nhỏ đi."));
}

  <div class="vi">Mẹo: đọc kỹ số điểm [ ] ở cuối mỗi câu – câu 2 điểm thì phải viết 2 ý.</div>`);
  const b=el("button",{class:"btn"},"Bắt đầu làm bài");b.onclick=()=>startTest(a);c.appendChild(b);a.appendChild(c);

function startTest(a){
  a.innerHTML="";
  // chọn câu cân bằng giữa các unit đến ~35 điểm
  const pool={};Object.keys(UNITS).forEach(u=>pool[u]=shuffle(Q.filter(q=>q.unit===u)));
  const pick=[];let m=0;const us=Object.keys(UNITS);let k=0;
  while(m<35&&us.some(u=>pool[u].length)){const u=us[k++%us.length];const q=pool[u].shift();if(!q)continue;if(m+qMax(q)>40)continue;pick.push(q);m+=qMax(q);}
  pick.sort((x,y)=>x.unit.localeCompare(y.unit));
  a.appendChild(el("h2",{},`Bài thi thử — tổng ${m} điểm`));
  const bar=el("div",{class:"sticky-score"});a.appendChild(bar);
  let left=40*60;const tick=()=>{bar.innerHTML=`<span>⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><span>${pick.length} câu • ${m} điểm</span>`;};tick();
  const timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);submit();}},1000);
  simStop=()=>clearInterval(timer);
  const items=pick.map((q,i)=>{const r=renderQuestion(q,i+1,null,"test");a.appendChild(r.node);return r;});
  const sb=el("button",{class:"btn ok",style:"font-size:18px;padding:14px 24px"},"Nộp bài ✔");a.appendChild(sb);
  let submitted=false;
  sb.onclick=()=>{if(sb.dataset.sure){submit();return;}sb.dataset.sure=1;sb.textContent="Bấm lần nữa để chắc chắn nộp bài";setTimeout(()=>{if(!submitted){delete sb.dataset.sure;sb.textContent="Nộp bài ✔";}},4000);};
  function submit(){
    if(submitted)return;submitted=true;clearInterval(timer);sb.disabled=true;
    let s=0;const byU={};
    items.forEach((r,i)=>{const sc=r.check();s+=sc;const u=pick[i].unit;byU[u]=byU[u]||[0,0];byU[u][0]+=sc;byU[u][1]+=qMax(pick[i]);});
    S.tests.push({d:new Date().toLocaleDateString("vi-VN"),s,m});save();
    const pct=Math.round(s/m*100);
    let h=`<div class="big">${fmt(s)} / ${m} (${pct}%)</div><p>${pct>=90?"🌟 Xuất sắc! Gần như điểm tối đa.":pct>=75?"👍 Khá tốt! Xem lại các câu sai bên dưới.":"💪 Cần ôn thêm – vào mục Bài học và Ôn câu sai."}</p><table class="t"><tr><th>Unit</th><th>Điểm</th></tr>`;
    Object.keys(byU).forEach(u=>h+=`<tr><td>Unit ${u} – ${UNITS[u].name}</td><td>${fmt(byU[u][0])}/${byU[u][1]}</td></tr>`);
    const res=el("div",{class:"card"},h+"</table><p class='muted'>Kéo xuống để xem đáp án và lời giải từng câu.</p>");
    a.insertBefore(res,a.children[1]);window.scrollTo({top:0,behavior:"smooth"});
  }
}

/* ---------- Ôn câu sai ---------- */
function review(a){
  const list=Q.filter(q=>S.best[q.id]&&S.best[q.id].wrong);
  if(!list.length){a.appendChild(el("div",{class:"card"},"<h3>🎉 Không có câu sai nào cần ôn!</h3><p>Hãy làm Luyện tập hoặc Thi thử. Câu nào làm chưa đúng sẽ tự động xuất hiện ở đây; làm đúng lại thì câu đó sẽ biến mất.</p>"));return;}
  runSet(a,list,`🔁 Ôn lại ${list.length} câu đã làm sai`);
}
